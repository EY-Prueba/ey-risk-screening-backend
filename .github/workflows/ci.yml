name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore
        run: dotnet restore EyRiskScreening.slnx --locked-mode

      - name: Build
        run: dotnet build EyRiskScreening.slnx --configuration Release --no-restore

      - name: Install Playwright Chromium
        run: pwsh tests/EyRiskScreening.IntegrationTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test
        run: dotnet test EyRiskScreening.slnx --configuration Release --no-build
